name: USA Job Hunter scans

on:
  schedule:
    - cron: "0 */4 * * *"     # scan every 4 hours
    - cron: "30 11 * * *"     # daily checks (11:30 UTC = 7:30 PM Philippine time)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan | daily | full | CLOSED_CHECK | VERIFY_CONTACTS | ENG | H1B"
        default: scan

concurrency:
  group: jobhunter-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JH_SECRET_KEY: ${{ secrets.JH_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, paid - leave unset
          JH_GMAIL_ADDRESS: ${{ secrets.JH_GMAIL_ADDRESS }}
          JH_GMAIL_APP_PASSWORD: ${{ secrets.JH_GMAIL_APP_PASSWORD }}
          JH_NOTIFY_EMAIL: ${{ secrets.JH_NOTIFY_EMAIL }}
          JH_APP_URL: https://sniperteacherjob.vercel.app
          JH_DATA_DIR: /tmp/jobhunter
          JH_SCHEDULER: "0"
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 11 * * *" ]; then MODE=daily; else MODE=scan; fi
          fi
          python -m app.cloud_run "$MODE"
